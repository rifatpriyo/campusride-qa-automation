name: CampusRide QA

on: [push, pull_request]

permissions:
  contents: read

env:
  DEMO_BUG_MODE: 'false'
  CAMPUSRIDE_SECURE_COOKIE: 'false'

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: backend
            requirements: requirements-dev.txt
          - suite: newman
            requirements: requirements.txt
          - suite: chromium
            requirements: automation/requirements.txt
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: python -m pip install -r "${{ matrix.requirements }}"

      - name: Prepare report directory
        run: mkdir -p reports/ci

      - name: Run backend and API tests
        if: matrix.suite == 'backend'
        run: python -m pytest tests -q -ra --junitxml=reports/ci/backend.xml

      - name: Set up Node.js for Newman
        if: matrix.suite == 'newman'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Seed the database and run the Postman collection
        if: matrix.suite == 'newman'
        env:
          CAMPUSRIDE_DB_PATH: ${{ runner.temp }}/campusride-newman.db
        run: |
          python -m app.demo
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-proxy-headers &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused \
            --max-time 3 http://127.0.0.1:8000/health
          npx --yes newman@6.2.1 run api-testing/CampusRide.postman_collection.json \
            -e api-testing/CampusRide.local.postman_environment.json \
            --ignore-redirects --timeout-request 10000 --reporters cli,junit \
            --reporter-junit-export reports/ci/newman.xml

      - name: Install Chromium and system dependencies
        if: matrix.suite == 'chromium'
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests
        if: matrix.suite == 'chromium'
        run: |
          python -m pytest -c automation/pytest.ini automation/tests -v \
            --junitxml=reports/ci/ui.xml --html=reports/ci/ui-report.html \
            --output=reports/ci/artifacts

      - name: Upload reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: qa-${{ matrix.suite }}
          path: reports/ci/
          retention-days: 14
          if-no-files-found: error
